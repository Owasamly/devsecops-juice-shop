name: CI Security Scanning Matrix
on: 
    push:
        branches: [ "main" , "master" ]
    pull_request:
        branches: [ "main" , "master"  ]
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
jobs:
    trufflehog-secrets-scan:
     name: Secret Detection (TruffleHog)
     runs-on: ubuntu-latest

     steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Run TruffleHog container directly mounted into the workspace
      - name: Run TruffleHog Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/pwd" \
            trufflesecurity/trufflehog:latest \
            filesystem /pwd \
            --only-verified \
            --format=sarif \
            --out=/pwd/trufflehog-results.sarif
        continue-on-error: true

      # Step 2: Ensure SARIF has valid schema structure if TruffleHog didn't write one
      - name: Validate SARIF File
        run: |
          if [ ! -f trufflehog-results.sarif ] || [ ! -s trufflehog-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"TruffleHog","version":"3.0.0"}},"results":[]}]}' > trufflehog-results.sarif
          fi

      # Step 3: Upload SARIF report to GitHub Security
      - name: Upload TruffleHog Sarif report to Github Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trufflehog-results.sarif
          category: trufflehog-secrets


    semgrep-sast-scan:
        name: SAST Scan (Semgrep)
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
 
        steps:
            - name: checkout code repositroy
              uses: actions/checkout@v4

            - name: Execute Semgrep Scan
              run: |
                    semgrep scan \
                    --config auto \
                    --sarif \
                    --output semgrep-results.sarif .

            - name: Upload SAST SARIF report to Github Securty
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                sarif_file: semgrep-results.sarif
                category: semgrep-sast
    
    trivy-sca-scan:
        name: SCA & Dependency Scanning (Trivy)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4

            - name: Run Trivy Vulnerability Scanner
              uses: aquasecurity/trivy-action@master
              with:
                scan-type: fs
                format: sarif
                output: trivy-results.sarif
                severity: 'CRITICAL, HIGH'

            - name: Upload Trivy Sarif report to Github Security
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                sarif_file: trivy-results.sarif
                category: trivy-sca