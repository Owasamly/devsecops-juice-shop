name: CI Security Scanning Matrix
on: 
    push:
        branches: [ "main" , "master" ]
    pull_request:
        branches: [ "main" , "master"  ]
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
jobs:
    trufflehog-secrets-scan:
        name: Secret Detection (TruffleHog)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4

            - name: Run TruffleHog OSS Scanner
              uses: trufflesecurity/trufflehog@main
              with:
                extra_args: --only-verified

            - name: Upload TruffleHog Sarif report to Github Security
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                sarif_file: trufflehog-results.sarif
                category: trufflehog-secrets


    semgrep-sast-scan:
        name: SAST Scan (Semgrep)
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
 
        steps:
            - name: checkout code repositroy
              uses: actions/checkout@v4

            - name: Execute Semgrep Scan
              run: |
                    semgrep scan \
                    --config auto \
                    --sarif \
                    --output semgrep-results.sarif .

            - name: Upload SARIF report to Github Securty
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                sarif_file: semgrep-results.sarif
                category: semgrep-sast
    
    trivy-sca-scan:
        name: SCA & Dependency Scanning (Trivy)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4

            - name: Run Trivy Vulnerability Scanner
              uses: aquasecurity/trivy-action@master
              with:
                scan-type: fs
                format: sarif
                output: trivy-results.sarif
                severity: 'CRITICAL, HIGH'

            - name: Upload Trivy Sarif report to Github Security
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                sarif_file: trivy-results.sarif
                category: trivy-sca