name: CI Security Scanning Matrix
on: 
    push:
        branches: [ "main" , "master" ]
    pull_request:
        branches: [ "main" , "master"  ]
    workflow_dispatch:
jobs:
    trufflehog-secrets-scan:
        name: Secret Detection (TruffleHog)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4

            - name: Run TruffleHog OSS Scanner
              uses: trufflesecurity/trufflehog@main
              with:
                extra_args: --only-verified
    semgrep-sast-scan:
        name: SAST Scan (Semgrep)
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep

        steps:
            - name: checkout code repositroy
              uses: actions/checkout@v4
              
            - name: Execute Semgrep Scan
              run: |
                    semgrep scan \
                    --config auto \
                    --json \
                    --output semgrep-results.json .

            - name: Save semgrep report artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: semgrep-sast-report
                path: semgrep-results.json