name: CI Security Scanning Matrix
on: 
    push:
        branches: [ "main" , "master" ]
    pull_request:
        branches: [ "main" , "master"  ]
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
jobs:
    trufflehog-secrets-scan:
     name: Secret Detection (TruffleHog)
     runs-on: ubuntu-latest

     steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Install TruffleHog using sudo so it lands safely in /usr/local/bin
      - name: Install TruffleHog CLI
        run: |
          curl -sSFL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      # Step 2: Run TruffleHog filesystem scan directly
      - name: Run TruffleHog Scan
        run: |
          trufflehog filesystem . \
            --only-verified \
            --format=sarif \
            --out=trufflehog-results.sarif
        continue-on-error: true

      # Step 3: Ensure SARIF file exists even if 0 secrets were found
      - name: Verify SARIF File Exists
        run: |
          if [ ! -f trufflehog-results.sarif ]; then
            echo '{"version": "2.1.0", "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json", "runs": []}' > trufflehog-results.sarif
          fi

      # Step 4: Upload SARIF report to GitHub Security
      - name: Upload TruffleHog Sarif report to Github Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trufflehog-results.sarif
          category: trufflehog-secrets
    



    semgrep-sast-scan:
        name: SAST Scan (Semgrep)
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
 
        steps:
            - name: checkout code repositroy
              uses: actions/checkout@v4

            - name: Execute Semgrep Scan
              run: |
                    semgrep scan \
                    --config auto \
                    --sarif \
                    --output semgrep-results.sarif .

            - name: Upload SAST SARIF report to Github Securty
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                sarif_file: semgrep-results.sarif
                category: semgrep-sast
    
    trivy-sca-scan:
        name: SCA & Dependency Scanning (Trivy)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4

            - name: Run Trivy Vulnerability Scanner
              uses: aquasecurity/trivy-action@master
              with:
                scan-type: fs
                format: sarif
                output: trivy-results.sarif
                severity: 'CRITICAL, HIGH'

            - name: Upload Trivy Sarif report to Github Security
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                sarif_file: trivy-results.sarif
                category: trivy-sca